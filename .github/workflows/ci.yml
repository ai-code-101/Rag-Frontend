name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  widget:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: widget } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: widget/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Generated loader is up to date
        run: npm run build && git diff --exit-code ../web/lib/widget-loader.generated.ts

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build # also generates next-env.d.ts and route types
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - run: npm run lint
